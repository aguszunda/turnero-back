services:
  postgres:
    image: postgres:16-alpine
    container_name: turnero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnero}
      POSTGRES_USER: ${POSTGRES_USER:-turnero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - turnero-postgres-data:/var/lib/postgresql/data

volumes:
  turnero-postgres-data: